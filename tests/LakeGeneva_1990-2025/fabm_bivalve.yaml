instances:
  abiotic_water:
    long_name: abiotic_process_in_water
    model: wet/abiotic_water
    parameters:
      O2PerNH4W: 2.0                                             #  used O2 per NH4 nitrified(mol/mol), default = 2.0
      cExtSpIM: 0.05                                             #  specific extinction inorganic matter(m2/gDW), default = 0.05
      cKPAdsOxW: 0.6                                             #  P adsorption affinity at oxidized conditions(m3/gP), default = 0.6
      cRelPAdsAlW: 0.134                                         #  maximum P adsorption per g Al(gP/gAl), default = 0.134
      cRelPAdsDWW: 0.00003                                       #  maximum P adsorption per g DW(gP/gDW), default = 0.00003
      cRelPAdsFeW: 0.0675                                        #  maximum P adsorption per g Fe(gP/gFe), default = 0.0675
      cThetaAer: 1.011                                           #  temperature coefficient for reaeration(1/e^*C), default = 1.011
      cThetaNitrW: 1.03                                          #  temperature coefficient for nitrification(1/e^*C), default = 1.03
      cVSetIM: -1.1                                              #  maximum settling rate of inorganic matter(m/d), default = -1.1
      fAlDIMW: 0.01                                              #  Al content of inorganic matter(gAl/gDW), default = 0.01
      fFeDIMW: 0.01                                              #  Fe content of inorganic matter(gFe/gDW), default = 0.01
      fRedMaxW: 0.9                                              #  maximum reduction factor of P adsorption affinity(-), default = 0.9
      hO2Nitr: 2.0                                               #  half saturation oxygen conc. for nitrification(mgO2/l), default = 2.0
      kNitrW: 0.3                                                #  nitrification rate constant in water at 20*C(1/d), default = 0.3
      kPSorpW: 0.05                                              #  P adsorption rate constant(1/d), default = 0.05
      kSiMinPaW: 0.03                                            #  biodissolution constant of particulate Si to SiO2 at 20*C(1/d), default = 0.03
      diagnostics: true
    initialization:
      sNH4W: 0.05                                                # ammonium (g/m3)
      sNO3W: 0.5                                                 # nitrate (g/m3)
      sPO4W: 0.1                                                 # phosphate (g/m3)
      sPAIMW: 0.0                                                # IM-adsorbed P (g/m3)
      sSiO2W: 3.5                                                # silica dioxide (g/m3)
      sO2W: 13.0                                                 # oxygen (g/m3)
      sDIMW: 4.0                                                 # inorganic matter (g/m3)
      sSiPaW: 0.025                                              # particulate Si (g/m3)
  abiotic_sediment:
    long_name: abiotic_process_in_sediment
    model: wet/abiotic_sediment
    parameters:
      NO3PerCS: 1.0                                              #  NO3 denitrified per C mineralized(mol/mol), default = 1.0
      O2PerNH4S: 2.0                                             #  O2 used per NH4 nitrified(mol/mol), default = 2.0
      bPorCorS: 0.737275                                         #  sediment porosity corrected for tortuosity(m3/m3), default = 0.737275
      bPorS: 0.58                                                #  sediment porosity(m3/m3), default = 0.58
      cDepthS: 0.1                                               #  sediment depth(m), default = 0.1
      cKPAdsOxS: 1.5                                             #  P adsorption affinity at oxidized conditions(m3/gP), default = 1.5
      cRelPAdsAlS: 0.134                                         #  max. P adsorption per g Al(gP/gAl), default = 0.134
      cRelPAdsDWS: 0.00003                                       #  max. P adsorption per g DW(gP/gDW), default = 0.00003
      cRelPAdsFeS: 0.06                                          #  max. P adsorption per g Fe(gP/gFe), default = 0.06
      cThetaNitrS: 1.03                                          #  temperature coefficient for nitrification(1/e^*C), default = 1.03
      cTurbDifO2: 5.0                                            #  bioturbation factor for oxygen diffusion(-), default = 5.0
      coPO4Max: 1.4                                              #  max. soluble reactive P conc. in pore water(mgP/l), default = 1.4
      fAlDIMS: 0.01                                              #  Al content of inorganic matter(gAl/gD), default = 0.01
      fDepthDifS: 0.5                                            #  nutrient diffusion distance as fraction of sediment depth(-), default = 0.5
      fFeDIM: 0.04                                               #  Fe content of inorganic matter(gFe/gD), default = 0.04
      fRedMaxS: 0.96                                             #  max. reduction factor of P adsorption affinity(-), default = 0.96
      hNO3DenitS: 0.5                                            #  quadratic half-sat. NO3 conc. for denitrification(mgN/l), default = 0.5
      kNitrS: 1.2                                                #  nitrification rate constant at 20*C(1/d), default = 1.2
      kO2Dif: 0.00017                                            #  O2 diffusion constant at 20*C(m2/d), default = 0.00017
      kPChemPO4: 0.03                                            #  chemical PO4 loss rate(1/d), default = 0.03
      kPSorpS: 0.03                                              #  P sorption rate constant(1/d), default = 0.03
      kSiMinPaS: 0.03                                            #  SiPOM to SiO2 biodissolution constant at 20*C(1/d), default = 0.03
      nPOM: 1                                                    # number of benthic particulate OM instances
      nDOM: 1                                                    # number of benthic dissolved OM instances
      hypsograph: true                                           # indicate hypsograph presence/absence (true or false)
      diagnostics: true
    initialization:
      sNH4S: 0.04                                                # ammonium (g/m2)
      sNO3S: 0.025                                               # nitrate (g/m2)
      sPO4S: 0.02                                                # phosphate (g/m2)
      sPAIMS: 2.0                                                # absorbed phosphate (g/m2)
      sDIMS: 31700.0                                             # inorganic matter (g/m2)
      sSiO2S: 0.1                                                # dissolved SiO2 (g/m2)
      sSiPaS: 14.0                                               # particulate Si (g/m2)
    coupling:
      oxygen_pool_water: abiotic_water/sO2W                      # Oxygen pool water (g/m3)
      #water_column_NH4: abiotic_water/sNH4W                      # water column NH4 (g/m3)
      #water_column_NO3: abiotic_water/sNO3W                      # water column NO3 (g/m3)
      #water_column_PO4: abiotic_water/sPO4W                      # water column PO4 (g/m3)
      #water_column_SiO2: abiotic_water/sSiO2W                    # water column SiO2 (g/m3)
      Trans_DPOM_sediment_update1: POM/tDTrans                   # Transformation DPOM sediment update 1 (POM)
      Trans_CPOM_sediment_update1: POM/tCTrans                   # Transformation CPOM sediment update 1 (POM)
      Trans_DDOM_sediment_update1: DOM/tDTrans                   # Transformation DDOM sediment update 1 (DOM)
      Trans_CDOM_sediment_update1: DOM/tCTrans                   # Transformation CDOM sediment update 1 (DOM) 
  bot_pel_interface:
    long_name: bot_pel_interface
    model: wet/bot_pel_interface
    parameters:
      hypsograph: true                                           # indicate hypsograph presence/absence (true or false)
  burial:
    long_name: burial
    model: wet/burial
    parameters:
      cNH4Ground: 1.0                                            #  NH4 concentration in groundwater(mgN/l), default = 1.0
      cNO3Ground: 0.1                                            #  NO3 concentration in groundwater(mgN/l), default = 0.1
      cPO4Ground: 0.1                                            #  PO4 concentration in groundwater(mgP/l), default = 0.1
      cRhoIM: 2500000.0                                          #  density of sediment inorganic matter(g/m3), default = 2500000.0
      cRhoOM: 1400000.0                                          #  density of sediment organic matter(g/m3), default = 1400000.0
      fDOrgSoil: 0.1                                             #  deep sediment organic matter fraction(-), default = 0.1
      nPHYT: 2
      nBENT: 0
      nMACRO: 1
      nPOM: 2
      nPOMexch: 1
      nDOM: 1
      diagnostics: true
    coupling:
      NH4_pool_in_sediment: abiotic_sediment/sNH4S               # NH4 pool in sediment (g/m2)
      NO3_pool_in_sediment: abiotic_sediment/sNO3S               # NO3 pool in sediment (g/m2)
      PO4_pool_in_sediment: abiotic_sediment/sPO4S               # PO4 pool in sediment (g/m2)
      PAIM_in_sediment: abiotic_sediment/sPAIMS                  # adsorbed phosphorus in sediment (g/m2)
      inorg_pool_in_sediment: abiotic_sediment/sDIMS             # inorganic matter pool in sediment (g/m2)
      particulate_Si_in_sediment: abiotic_sediment/sSiPaS        # Particulate Si in sediment (g/m2)
      humus_DW_in_deep_sediment: humus/sDS                       # humus DW in deep sediment
      humus_N_in_deep_sediment: humus/sNS                        # humus N in deep sediment
      humus_P_in_deep_sediment: humus/sPS                        # humus P in deep sediment
      humus_C_in_deep_sediment: humus/sCS                        # humus C in deep sediment
      IM_abiotic_update: sediment_exchange/tDAbioIMS             # IM abiotic update (g/m2/s)
      bPorS: abiotic_sediment/bPorS                              # sediment porosity (m3/m3)
      cDepthS: abiotic_sediment/cDepthS                          # sediment depth (m)
      bot_pel_conv: bot_pel_interface/bot_pel_conv                # bottom/pelagic conversion factor
      POM_phytoplankton_update1: cyanobacteria/tDPOMS
      POM_phytoplankton_update2: diatoms/tDPOMS
      POM_macrophyte_update1: macrophytes/tDBedPOMS
      POM_sediment_update1: POM/tDPOMS                   # done auto by POM_group coupling
      POM_sediment_update2: humus/tDPOMS                 # done auto by POM_group coupling
      POM_exchange_update1: sediment_exchange/tDExchPOMS_1 # POM
      DOM_group1: DOM
      POM_group1: POM
      POM_group2: humus
  sediment_exchange:
    long_name: sediment_exchange
    model: wet/sediment_exchange
    parameters:
      alpha: 9000.0                                              # qResus = 2; gross rate of sediment erosion(g/m/d), default = 9000.0
      cFetch: 1000.0                                             # qResus = 1; length of water body in prevailing wind direction(m), default = 1000.0
      cFetchRef: 1000.0                                          # qResus = 1; reference fetch(m), default = 1000.0
      cSuspMax: 25.2                                             # qResus = 1; maximum value of logistic function(-), default = 25.2
      cSuspMin: 6.1                                              # qResus = 1; minimum value of logistic function(-), default = 6.1
      cSuspRef: 0.0                                              # qResus = 1; reference suspended matter function(-), default = 0.0
      cSuspSlope: 2.1                                            # qResus = 1; slope of logistic function(-), default = 2.1
      cThetaSed: 1.01                                            # temperature coefficient of sedimentation(1/e^*C), default = 1.01
      cVSedIM: 1.0                                               # IM sedimentation velocity constant at 20*C(m/d), default = 1.0
      cVSetMain: 0.5                                             # qResus = 2; depth averaged settling velocity(m/d), default = 0.5
      crt_shear: 0.02                                            # qResus = 2; critical shear stress(N/m), default = 0.02
      eta: 1.0                                                   # qResus = 2; shear stress correction factor(-), default = 1.0
      fLutum: 0.1                                                # lutum fraction of inorganic matter(-), default = 0.1
      fLutumRef: 0.2                                             # reference lutum fraction of inorganic matter(-), default = 0.2
      hDepthSusp: 2.0                                            # qResus = 1; half-sat. value of depth in logistic function(-), default = 2.0
      kVegResus: 0.05                                            # relative resuspension reduction per gram macrophytes(m2/gDW), default = 0.05
      qResus: 2                                                  # 1=original PCLake; 2=based on shear stress(-), default = 2
      ref_shear: 1.0                                             # qResus = 2; reference shear stress(N/m), default = 1.0
      cThetaDif: 1.016                                           # temperature coefficient for diffusion (1/e^*C), default = 1.016
      cTurbDifNut: 12.0                                          # bioturbation correction of nutrient diffusion (-), default = 12.0 
      kNDifNH4: 0.000112                                         # molecular NH4 diffusion constant at 20*C (m2/d), default = 0.000112
      kNDifNO3: 0.000086                                         # NO3 diffusion constant at 20*C (m2/d), default = 0.000086
      kPDifPO4: 0.000072                                         # PO4 diffusion constant at 20*C (m2/d), default = 0.000072
      kSiO2Dif: 0.0000864                                        # SiO2 diffusion constant at 20*C (m2/d), default = 0.0000864
      nPOM: 1                                                    # number of POM groups (resupension and sedimentation)
      cVSedPOM1: 0.5                                             # POM sedimentation velocity constant at 20*C for POM 1
      nDOM: 1                                                    # number of DOM groups (diffusion)
      kDDifDOM1: 0.002                                           # DOM diffusion constant DW at 20*C for DOM 1
      kNDifDOM1: 0.000085                                        # DOM diffusion constant N at  20*C for DOM 1
      kPDifDOM1: 0.00016                                         # DOM diffusion constant P at  20*C for DOM 1
      diagnostics: true
    coupling:
      pom_model1: POM                                            # particulate OM target 1
      dom_model1: DOM                                            # dissolved OM target 1
      inorg_pool_in_sediment: abiotic_sediment/sDIMS             # sediment inorganic matter (g/m2)
      PO4_in_sediment: abiotic_sediment/sPO4S                    # sediment phosphate (g/m2)
      PAIM_in_sediment: abiotic_sediment/sPAIMS                  # sediment absorbed phosphate (g/m2)
      NH4_in_sediment: abiotic_sediment/sNH4S                    # sediment ammonium (g/m2)
      NO3_in_sediment: abiotic_sediment/sNO3S                    # sediment nitrate (g/m2)
      particulate_Si_in_sediment: abiotic_sediment/sSiPaS        # sediment particulate Si (g/m2)
      particulate_Si_in_water: abiotic_water/sSiPaW              # water particulate Si (g/m2)
      dissolved_Si_in_sediment: abiotic_sediment/sSiO2S          # sediment dissolved Si (g/m2)
      SiO2_in_water: abiotic_water/sSiO2W                        # water dissolved Si (g/m3)
      NH4_in_water: abiotic_water/sNH4W                          # water NH4 (g/m3)
      NO3_in_water: abiotic_water/sNO3W                          # water NO3 (g/m3)
      PO4_in_water: abiotic_water/sPO4W                          # water PO4 (g/m3)
      inorg_pool_in_water: abiotic_water/sDIMW                   # inorganic matter pool in water (g/m3)
      PAIM_in_water: abiotic_water/sPAIMW                        # adsorbed phosphorus in water (g/m3)
      bPorS: abiotic_sediment/bPorS                              # sediment porosity (m3/m3)
      bPorCorS: abiotic_sediment/bPorCorS                        # sediment porosity corrected for tortuosity (m3/m3)
      cDepthS: abiotic_sediment/cDepthS                          # sediment depth (m)
      fDepthDifS: abiotic_sediment/fDepthDifS                    # nutrient diffusion distance as fraction of sediment depth (-)
      bot_pel_conv: bot_pel_interface/bot_pel_conv                # bottom/pelagic conversion factor (-)
  POM:
    long_name: pom
    model: wet/om_pool
    parameters:
      # water
      #cCPerDWW: 0.4                                              # C content of organic matter (gC/gDW), default = 0.4
      cExtSp: 0.15                                               # specific extinction factor for OM (m2/gDW), default = 0.15
      cVSet: 0.3                                                 # maximum settling rate of OM (m/d), default = 0.3
      qTrans: 1                                                  # vert. trans. method: 0=no trans.; 1=constant) (-), default = 1
      # bio-transformation
      cThetaMinW: 1.02                                           # temperature coefficient of biotransformation in water (1/e^*C), default = 1.02
      kDMinW: 0.001                                              # bio-transform. in water constant of OM-DW at20*C (1/d), default = 0.001 
      kNMinW: 0.01                                               # bio-transform. in water constant of OM-N at 20*C (1/d), default = 0.01 
      kPMinW: 0.01                                               # bio-transform. in water constant of OM-P at 20*C (1/d), default = 0.01 
      hO2BOD: 1.0                                                # half saturation oxygen conc. for BOD (mgO2/l), default = 1.0
      hNO3DenitW: 1.0                                            # quadratic half saturation NO3 conc. for denitrification (mgN/l), default = 1.0
      NO3PerCW: 1.0                                              # denitrified NO3 per C mineralised (mol/mol), default = 1.0
      # sediment
      #cCPerDWS: 0.4                                              # C content of organic DW matter (gC/gDW), default = 0.4
      # bio-transformation
      cThetaMinS: 1.02                                           # temperature coefficient of biotransformation in sediment (1/e^*C), default = 1.02
      kDMinS: 0.001                                              # bio-transform. in sediment constant of OM-DW at 20*C (1/d), default = 0.001
      kNMinS: 0.01                                               # bio-transform. in sediment constant of OM-N at 20*C (1/d), default = 0.01
      kPMinS: 0.01                                               # bio-transform. in sediment constant of OM-P at 20*C (1/d), default = 0.01
      lTransPV: false                                             # bio-transform. sink to be projected to water (-), default = true
      lPOMtoDOM: true                                            # toggle POM to DOM transformation (-), default = true
      # 
      fRefrDWS: 0.1                                              # refractory fraction of sediment DW OM (-), default = 0.0
      fRefrNutS: 0.1                                             # refractory fraction of sediment N and P OM (-), default = 0.0
      lRefrPV: true                                              # refractory fraction to be projected to water (-), default = true
      lRefrpool: false                                           # toggle bio-transform. dependent on oxic sediment fraction (-), default = false
      #
      diagnostics: true
    initialization:
      sDW: 0.1                                                   # particulate org. matter DW (g/m3)
      sNW: 0.01                                                  # particulate organic N (g/m3)
      sPW: 0.001                                                 # particulate organic P (g/m3)
      sCW: 0.04                                                  # particulate organic C (g/m3)                                                                                         
      sDS: 3500.0                                                  # particulate organic DW (g/m2)
      sNS: 60.0                                                   # particulate organic N (g/m2)
      sPS: 10.0                                                   # particulate organic P (g/m2)
      sCS: 1500.0                                                 # particulate organic C (g/m2)                                                                                         
      sDS_PV: 3500.0                                               # particulate organic DW pel. var. (g/m2)
      sNS_PV: 60.0                                                # particulate organic N pel. var. (g/m2)
      sPS_PV: 10.0                                                # particulate organic P pel. var. (g/m2)
      sCS_PV: 1500.0                                              # particulate organic C pel. var. (g/m2)                                                                                                   
    coupling:
      DW_transformation_water: DOM/sDW                           # DW biotransformation target water (g/m3)
      N_transformation_water: DOM/sNW                            # N biotransformation target water (g/m3)
      P_transformation_water: DOM/sPW                            # P biotransformation target water (g/m3)
      C_transformation_water: DOM/sCW                            # C biotransformation target water (g/m3)                                                                                                    
      DW_transformation_sediment: DOM/sDS                        # DW biotransformation target sediment (g/m2)
      N_transformation_sediment: DOM/sNS                         # N biotransformation target sediment (g/m2)
      P_transformation_sediment: DOM/sPS                         # P biotransformation target sediment (g/m2)
      C_transformation_sediment: DOM/sCS                         # C biotransformation target sediment (g/m2)                                                                                                       
      DW_refractory_sediment: humus/sDS                          # DW refractory target sediment (g/m2)
      N_refractory_sediment: humus/sNS                           # N refractory target sediment (g/m2)
      P_refractory_sediment: humus/sPS                           # P refractory target sediment (g/m2)
      C_refractory_sediment: humus/sCS                           # C refractory target sediment (g/m2)                                                                                                
      #DW_refractory_sediment_PV: humus/sDS_PV                    # DW refractory target sediment pelagic mirror (g/m3)
      #N_refractory_sediment_PV: humus/sNS_PV                     # N refractory target sediment pelagic mirror (g/m3)
      #P_refractory_sediment_PV: humus/sPS_PV                     # P refractory target sediment pelagic mirror (g/m3)
      oxygen_pool_water: abiotic_water/sO2W                      # oxygen_pool_water (g/m3)
      NO3_pool_water: abiotic_water/sNO3W                        # NO3 pool water (g/m3)
      bot_pel_conv: bot_pel_interface/bot_pel_conv                # bottom/pelagic conversion factor
  DOM:
    long_name: dom
    model: wet/om_pool
    parameters:
      # water
      #cCPerDWW: 0.4                                              # C content of organic matter (gC/gDW), default = 0.4
      cExtSp: 0.0                                                # specific extinction factor for OM (m2/gDW), default = 0.15
      cVSet: 0.0                                                 # maximum settling rate of OM (m/d), default = 0.0
      qTrans: 1                                                  # vert. trans. method: 0=no trans.; 1=constant (-), default = 1
      # bio-transformation
      cThetaMinW: 1.07                                           # temperature coefficient of biotransformation in water (1/e^*C), default = 1.07
      kDMinW: 0.03                                               # bio-transform. in water constant of OM-DW at 20*C (1/d), default = 0.001 
      kNMinW: 0.01                                               # bio-transform. in water constant of OM-N at 20*C (1/d), default = 0.01 
      kPMinW: 0.01                                               # bio-transform. in water constant of OM-P at 20*C (1/d), default = 0.01 
      hO2BOD: 1.0                                                # half saturation oxygen conc. for BOD (mgO2/l), default = 1.0
      hNO3DenitW: 1.0                                            # quadratic half saturation NO3 conc. for denitrification (mgN/l), default = 1.0
      NO3PerCW: 1.0                                              # denitrified NO3 per C mineralised (mol/mol), default = 1.0
      # sediment
      #cCPerDWS: 0.4                                              # C content of organic DW matter (gC/gDW), default = 0.4
      # bio-transformation
      cThetaMinS: 1.06                                           # temperature coefficient of biotransformation in sediment (1/e^*C), default = 1.02
      kDMinS: 0.001                                              # bio-transform. in sediment constant of OM-DW at 20*C (1/d), default = 0.001
      kNMinS: 0.003                                              # bio-transform. in sediment constant of OM-N at 20*C (1/d), default = 0.01
      kPMinS: 0.003                                              # bio-transform. in sediment constant of OM-P at 20*C (1/d), default = 0.01
      lTransPV: false                                            # bio-transform. sink/target to be projected to water (-), default = true
      lPOMtoDOM: false                                           # toggle POM to DOM transformation (-), default = true
      # 
      lRefrPV: false                                             # refractory fraction to be projected to water (-), default = true
      fRefrDWS: 0.0                                              # refractory fraction of sediment DW OM (-), default = 0.0
      fRefrNutS: 0.0                                             # refractory fraction of sediment N and P OM (-), default = 0.0
      lRefrpool: false                                           # toggle bio-transform. dependent on oxic sediment fraction (-), default = false
      lTransDWtarget: false                                      # toggle DW bio-transformation target
      #
      diagnostics: true
    initialization:
      sDW: 2.5                                                   # dissolved org. matter DW (g/m3)
      sNW: 0.01                                                  # dissolved organic N (g/m3)
      sPW: 0.001                                                 # dissolved organic P (g/m3)
      sCW: 1.0                                                   # dissolved organic C (g/m3)
      sDS: 10.0                                                  # dissolved organic matter (g/m2)
      sNS: 0.06                                                  # dissolved organic N (g/m2)
      sPS: 0.01                                                  # dissolved organic P (g/m2)
      sCS: 4.0                                                   # dissolved organic C (g/m2)                                                                                                
    coupling:
      #DW_transformation_water: DOM/sDW                           # DW biotransformation target water (g/m3) # TKA: What to do?
      N_transformation_water: abiotic_water/sNH4W                # N biotransformation target water (g/m3)
      P_transformation_water: abiotic_water/sPO4W                # P biotransformation target water (g/m3)
      #DW_transformation_sediment: DOM/sDS                        # DW biotransformation target sediment (g/m2) # TKA: What to do?
      N_transformation_sediment: abiotic_sediment/sNH4S          # N biotransformation target sediment (g/m2)
      P_transformation_sediment: abiotic_sediment/sPO4S          # P biotransformation target sediment (g/m2)
      oxygen_pool_water: abiotic_water/sO2W                      # oxygen_pool_water (g/m3)
      NO3_pool_water: abiotic_water/sNO3W                        # NO3 pool water (g/m3)
      bot_pel_conv: bot_pel_interface/bot_pel_conv                # bottom/pelagic conversion factor     
  humus:
    long_name: humus
    model: wet/om_pool
    parameters:
      # water
      #cCPerDWW: 0.4                                              # C content of organic matter (gC/gDW), default = 0.4
      cExtSp: 0.15                                               # specific extinction factor for OM (m2/gDW), default = 0.15
      cVSet: 0.5                                                 # maximum settling rate of OM (m/d), default = 0.3
      qTrans: 1                                                  # vert. trans. method: 0=no trans.; 1=constant) (-), default = 1
      # bio-transformation
      cThetaMinW: 1.02                                           # temperature coefficient of biotransformation in water (1/e^*C), default = 1.02
      kDMinW: 0.0001                                             # bio-transform. in water constant of OM-DW at20*C (1/d), default = 0.001 
      kNMinW: 0.001                                              # bio-transform. in water constant of OM-N at 20*C (1/d), default = 0.01 
      kPMinW: 0.001                                              # bio-transform. in water constant of OM-P at 20*C (1/d), default = 0.01 
      hO2BOD: 1.0                                                # half saturation oxygen conc. for BOD (mgO2/l), default = 1.0
      hNO3DenitW: 1.0                                            # quadratic half saturation NO3 conc. for denitrification (mgN/l), default = 1.0
      NO3PerCW: 1.0                                              # denitrified NO3 per C mineralised (mol/mol), default = 1.0
      # sediment
      #cCPerDWS: 0.4                                              # C content of organic DW matter (gC/gDW), default = 0.4
      # bio-transformation
      cThetaMinS: 1.074                                          # temperature coefficient of biotransformation in sediment (1/e^*C), default = 1.02
